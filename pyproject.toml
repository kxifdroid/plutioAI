[project]
name = "plutio"
version = "0.1.0"
description = "Plutio AI Content Platform"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "psycopg2-binary>=2.9.9",
    "feedparser>=6.0.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0,<6.0.0",
    "Pillow>=10.0.0",
    "cloudinary>=1.36.0",
    "trafilatura>=1.6.0",
    "flasgger>=0.9.7",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "yt-dlp>=2024.0.0",
]

[tool.vercel]
entrypoint = "insights_web:app"
